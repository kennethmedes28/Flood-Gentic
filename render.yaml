# Render Blueprint: the Muse proxy (render_proxy/), which forwards the backend's chat-model and SAM calls to Meta's API.
# Meta refuses those calls from Railway but accepts them from Render (tested on 4 November 2026). The backend itself and
# voice stay on Railway. See render_proxy/README.md and docs/deployment_workflow_guide.md ("Render: the Muse proxy").
services:
  - type: web
    name: muse-proxy
    runtime: python
    region: singapore          # close to the Railway backend's users, PAGASA and Redis
    plan: free                 # sleeps after about 15 minutes without calls; the first call after that waits for it to wake
    branch: render-deployment  # change to main after the branch is merged
    rootDir: render_proxy
    buildFilter:
      paths:
        - render_proxy/**      # only proxy changes redeploy it, not backend or frontend changes
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15         # the same Python as the backend
      - key: MUSE_API          # Meta's key; set in the Render dashboard (never in git)
        sync: false
      - key: MUSE_PROXY_SECRET # the shared secret; the same value goes into Railway's MUSE_PROXY_SECRET
        sync: false
